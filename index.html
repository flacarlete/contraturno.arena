    // FUNÇÃO DE POPULAR PROFESSORES - CORRIGIDA
    function atualizarListaProfessores() {
      const selectSegmento = document.getElementById('profSegmento');
      const selectProfessor = document.getElementById('profNome');
      
      if (!selectSegmento || !selectProfessor) return;

      const segmento = selectSegmento.value;
      const lista = PROFESSORES_DATA[segmento] || [];
      
      selectProfessor.innerHTML = '<option value="">Selecione o professor...</option>';
      lista.forEach(prof => {
        const option = document.createElement('option');
        option.value = prof;
        option.textContent = prof;
        selectProfessor.appendChild(option);
      });
    }

    // DISPARO NO CARREGAMENTO
    window.addEventListener('DOMContentLoaded', () => {
