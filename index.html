<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Arena Contraturno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .aba-conteudo { display: none; }
    .aba-btn.active { border-bottom: 3px solid #1b4332; color: #1b4332; font-weight: 700; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div id="sistema-principal">
    <header class="bg-[#1b4332] text-white p-4"><h1>Arena Contraturno</h1></header>
    
    <!-- Navegação -->
    <nav class="bg-white border-b p-2 flex gap-4 overflow-x-auto">
      <button onclick="mudarAba('atrasos')" class="aba-btn active" id="btn-atrasos">Atrasos</button>
      <button onclick="mudarAba('sala-estudos')" class="aba-btn" id="btn-sala-estudos">Sala de Estudos</button>
      <button onclick="mudarAba('professores')" class="aba-btn" id="btn-professores">Professores</button>
      <button onclick="mudarAba('inspetores')" class="aba-btn" id="btn-inspetores">Inspetores</button>
      <button onclick="mudarAba('atendimentos')" class="aba-btn" id="btn-atendimentos">Atendimentos</button>
      <button onclick="mudarAba('contatos')" class="aba-btn" id="btn-contatos">Contatos</button>
      <button onclick="mudarAba('gerenciador')" class="aba-btn" id="btn-gerenciador">🔐 Acessos</button>
    </nav>

    <div class="p-6">
      <!-- ABA ATRASOS -->
      <section id="aba-atrasos" class="aba-conteudo" style="display:block;">
        <h2 class="text-xl font-bold mb-4">Registro de Atrasos</h2>
        <div class="bg-white p-6 rounded shadow">
            <!-- Coloque aqui os seus inputs de atraso -->
            <input list="listaAlunos" placeholder="Buscar aluno..." class="border p-2 w-full mb-4">
        </div>
      </section>

      <!-- ABA GERENCIADOR -->
      <section id="aba-gerenciador" class="aba-conteudo">
        <h2 class="text-xl font-bold mb-4">Gerenciador de Acessos</h2>
        <div class="bg-white p-6 rounded shadow">
            <p>Configurações de usuários aqui.</p>
        </div>
      </section>
      
      <!-- Adicione as outras seções (sala-estudos, professores, etc) aqui seguindo o mesmo padrão -->
    </div>
  </div>

  <datalist id="listaAlunos"></datalist>

  <script>
    function mudarAba(abaId) {
      document.querySelectorAll('.aba-conteudo').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('aba-' + abaId).style.display = 'block';
      document.getElementById('btn-' + abaId).classList.add('active');
    }
  </script>
</body>
</html>
