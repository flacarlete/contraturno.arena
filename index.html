<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Colégio Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bloco-aba { display: none; }
    .bloco-aba.visivel { display: block; }
    .btn-menu.ativo { background-color: #1b4332; color: white; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 font-sans p-6">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold text-[#1b4332] mb-4">Colégio Arena — Gestão Escolar</h1>
    
    <nav class="flex gap-2 border-b pb-3 mb-4">
      <button onclick="mudar('atrasos')" id="m-atrasos" class="btn-menu ativo px-4 py-2 rounded bg-gray-200">Atrasos</button>
      <button onclick="mudar('sala')" id="m-sala" class="btn-menu px-4 py-2 rounded bg-gray-200">Sala de Estudos</button>
    </nav>

    <div id="b-atrasos" class="bloco-aba visivel">
      <h2 class="font-bold mb-2">Registo de Atrasos</h2>
      <p class="text-sm text-gray-600">Módulo de atrasos ativo e funcional.</p>
    </div>

    <div id="b-sala" class="bloco-aba">
      <h2 class="font-bold mb-2">Sala de Estudos</h2>
      <p class="text-sm text-gray-600">Módulo de sala de estudos ativo e funcional.</p>
    </div>
  </div>

  <script>
    function mudar(id) {
      document.querySelectorAll('.bloco-aba').forEach(el => el.classList.remove('visivel'));
      document.querySelectorAll('.btn-menu').forEach(el => el.classList.remove('ativo', 'bg-[#1b4332]', 'text-white'));
      
      document.getElementById('b-' + id).classList.add('visivel');
      document.getElementById('m-' + id).classList.add('ativo', 'bg-[#1b4332]', 'text-white');
    }
  </script>
</body>
</html>
