<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Arena Contraturno</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1b4332] flex items-center justify-center min-h-screen p-4">

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div id="tela-login" class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full border border-emerald-900/20">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-emerald-100 text-[#1b4332] rounded-full mb-3 text-2xl">📋</div>
      <h1 class="text-xl font-bold text-gray-800">Arena Contraturno</h1>
      <p class="text-xs text-gray-500 mt-1">Coordenação e Acompanhamento</p>
    </div>

    <form onsubmit="fazerLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Usuário</label>
        <input type="text" id="loginUsuario" value="coordenacao" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#1b4332]" required />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Senha</label>
        <input type="password" id="loginSenha" value="123" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#1b4332]" required />
      </div>
      <button type="submit" class="w-full bg-[#1b4332] text-white py-2.5 rounded text-sm font-semibold hover:bg-emerald-900 transition">
        Entrar no Sistema →
      </button>
    </form>
  </div>

  <script>
    const USUARIOS_PADRAO = [
      { usuario: "coordenacao", senha: "123", nome: "Coordenação", perfil: "coordenacao", abas: ["atrasos", "sala-estudos", "professores", "inspetores", "atendimentos", "contatos", "gerenciador-acessos"] },
      { usuario: "assistente", senha: "123", nome: "Assistente", perfil: "assistente", abas: ["atrasos", "sala-estudos", "professores", "atendimentos", "contatos"] },
      { usuario: "inspetor", senha: "123", nome: "Inspetor", perfil: "inspetor", abas: ["sala-estudos"] }
    ];

    function fazerLogin(e) {
      e.preventDefault();
      const login = document.getElementById('loginUsuario').value.trim().toLowerCase();
      const senha = document.getElementById('loginSenha').value.trim();

      // Reset total para garantir que funcione
      localStorage.setItem('escola_usuarios_db', JSON.stringify(USUARIOS_PADRAO));
      
      const user = USUARIOS_PADRAO.find(u => u.usuario === login && u.senha === senha);

      if (user) {
        localStorage.setItem('usuario_logado_arena', JSON.stringify(user));
        window.location.href = 'sistema.html'; // Se você estiver usando multiplos arquivos, ou redirecione
        alert('Login realizado! Redirecionando...');
        // Como o sistema está em uma página só, você pode trocar a visibilidade aqui:
        // window.location.reload(); 
      } else {
        alert('Usuário ou senha incorretos. Tente: coordenacao / 123');
      }
    }
  </script>
</body>
</html>
