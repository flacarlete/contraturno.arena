<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gestão Escolar & Contraturno — Colégio Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .subtab-content { display: none; }
    .subtab-content.active { display: block; }
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-[#1b4332] text-white px-6 py-4 shadow flex flex-col md:flex-row justify-between items-start md:items-center no-print">
    <div>
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>📋</span> Controle de Gestão e Contraturno — Colégio Arena
      </h1>
      <p id="currentDateDisplay" class="text-xs text-emerald-200 mt-1"></p>
    </div>
    <div class="mt-2 md:mt-0 text-xs bg-emerald-900/80 px-3 py-1.5 rounded text-emerald-100 font-medium">
      🟢 <span>1.160</span> alunos carregados nativamente
    </div>
  </header>

  <!-- Navegação Principal -->
  <nav class="bg-white border-b border-gray-200 px-6 flex flex-wrap gap-2 text-sm font-medium text-gray-600 no-print">
    <button onclick="switchTab('atrasos')" id="tab-atrasos" class="tab-btn py-3 px-4 border-b-2 border-[#1b4332] text-[#1b4332] font-semibold flex items-center gap-2">⏰ Atrasos</button>
    <button onclick="switchTab('sala-estudos')" id="tab-sala-estudos" class="tab-btn py-3 px-4 border-b-2 border-transparent hover:text-[#1b4332] flex items-center gap-2">📚 Sala de Estudos & Biblioteca</button>
    <button onclick="switchTab('professores')" id="tab-professores" class="tab-btn py-3 px-4 border-b-2 border-transparent hover:text-[#1b4332] flex items-center gap-2">👨‍🏫 Professores</button>
    <button onclick="switchTab('inspetores')" id="tab-inspetores" class="tab-btn py-3 px-4 border-b-2 border-transparent hover:text-[#1b4332] flex items-center gap-2">📋 Inspetores / Orientadores</button>
    <button onclick="switchTab('atendimentos')" id="tab-atendimentos" class="tab-btn py-3 px-4 border-b-2 border-transparent hover:text-[#1b4332] flex items-center gap-2">📋 Atendimentos</button>
  </nav>

  <main class="p-6 max-w-6xl w-full mx-auto flex-1">

    <!-- ABA 1: ATRASOS -->
    <section id="content-atrasos" class="tab-content active">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
        <div class="flex gap-4 border-b border-gray-200 pb-3 mb-4">
          <button onclick="setAtrasoTurno('Matutino')" id="btn-turno-mat" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">Período Matutino</button>
          <button onclick="setAtrasoTurno('Vespertino')" id="btn-turno-vesp" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">Período Vespertino</button>
        </div>

        <div class="bg-[#1b4332] text-white p-3 rounded-t-md font-semibold text-sm flex items-center gap-2">
          ⏰ Registrar Atrasos — <span id="labelTurno">Matutino</span>
        </div>

        <form id="formAtraso" onsubmit="salvarAtraso(event)" class="border border-gray-200 border-t-0 p-4 rounded-b-md bg-gray-50/50 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Espaço / Aula</label>
              <select id="atrasoEspaco" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" required>
                <option value="">Selecione...</option>
                <option value="Nivelamentos">Nivelamentos</option>
                <option value="Sala de estudos">Sala de estudos</option>
                <option value="Biblioteca">Biblioteca</option>
                <option value="Modalidades diversas">Modalidades diversas</option>
                <option value="AEE">AEE</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Horário de Chegada</label>
              <input type="time" id="atrasoHora" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Data</label>
              <input type="date" id="atrasoData" class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" required />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Nome do Aluno</label>
              <input type="text" id="atrasoAluno" placeholder="Nome completo..." class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm font-medium" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Turma</label>
              <input type="text" id="atrasoTurma" placeholder="Ex: 8ºG..." class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Motivo / Justificativa</label>
              <input type="text" id="atrasoMotivo" placeholder="Motivo do atraso..." class="w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm" required />
            </div>
          </div>

          <div class="flex justify-end">
            <button type="submit" class="bg-[#1b4332] text-white px-5 py-2 rounded text-sm font-medium hover:bg-emerald-900">
              ✓ Registrar atraso
            </button>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <h3 class="font-bold text-gray-700 text-sm mb-3">Histórico de Atrasos — <span id="labelTabelaTurno">Matutino</span></h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border border-gray-200">
            <thead class="bg-gray-100 font-semibold text-gray-70
