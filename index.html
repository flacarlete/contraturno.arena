<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gestão Escolar — Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    .aba-conteudo { display: none; }
    .aba-btn.active { border-bottom: 3px solid #1b4332; color: #1b4332; font-weight: 700; background-color: #f0fdf4; }
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea *, #printableProfIndividualArea, #printableProfIndividualArea *, #printableRelatorioArea, #printableRelatorioArea * { visibility: visible; }
      #printableArea, #printableProfIndividualArea, #printableRelatorioArea { 
        position: absolute; left: 0; top: 0; width: 100%; background: white !important; padding: 0 !important; margin: 0 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <div id="tela-login" class="fixed inset-0 bg-[#1b4332] z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full border border-emerald-900/20">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-emerald-100 text-[#1b4332] rounded-full mb-3 text-2xl">📋</div>
        <h1 class="text-xl font-bold text-gray-800">Arena Contraturno</h1>
        <p class="text-xs text-gray-500 mt-1">Painel de Gestão e Ocorrências (Sincronizado na Nuvem)</p>
      </div>

      <form onsubmit="fazerLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Usuário</label>
          <input type="text" id="loginUsuario" placeholder="Digite seu usuário..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#1b4332]" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#1b4332]" required />
        </div>
        <button type="submit" class="w-full bg-[#1b4332] text-white py-2.5 rounded text-sm font-semibold hover:bg-emerald-900 transition">
          Entrar no Sistema →
        </button>
      </form>
      <div class="mt-4 text-center">
        <button type="button" onclick="entrarComoCoordDireto()" class="text-xs text-[#1b4332] font-bold underline hover:text-emerald-800">
          Entrar como Coordenador (Padrão)
        </button>
      </div>
    </div>
  </div>

  <div id="sistema-principal" class="hidden flex flex-col flex-1 min-h-screen">
    
    <header class="bg-[#1b4332] text-white px-6 py-3.5 shadow flex flex-col md:flex-row justify-between items-start md:items-center no-print gap-3">
      <div>
        <h1 class="text-lg font-bold flex items-center gap-2">
          <span>📋</span> Colégio Arena — Gestão Escolar
        </h1>
        <p class="text-xs text-emerald-200 mt-0.5" id="headerCargoLogado">Painel Escolar (Online)</p>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right">
          <p id="usuarioLogadoNome" class="text-xs font-bold text-white">Usuário</p>
          <p id="usuarioLogadoPerfil" class="text-[11px] text-emerald-200">Perfil</p>
        </div>
        <button onclick="fazerLogout()" class="bg-red-800 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-semibold">
          Sair ⎋
        </button>
      </div>
    </header>

    <nav class="bg-white border-b border-gray-200 px-6 flex flex-wrap gap-2 text-sm font-medium text-gray-600 no-print">
      <button onclick="mudarAba('atrasos')" id="btn-aba-atrasos" class="aba-btn py-3 px-4 border-b-2 text-gray-600 flex items-center gap-2 active">⏰ Atrasos</button>
      <button onclick="mudarAba('sala-estudos')" id="btn-aba-sala-estudos" class="aba-btn py-3 px-4 border-b-2 text-gray-600 flex items-center gap-2">📚 Sala de Estudos</button>
      <button onclick="mudarAba('professores')" id="btn-aba-professores" class="aba-btn py-3 px-4 border-b-2 text-gray-600 flex items-center gap-2">👨‍🏫 Professores</button>
      <button onclick="mudarAba('inspetores')" id="btn-aba-inspetores" class="aba-btn py-3 px-4 border-b-2 text-gray-600 flex items-center gap-2">📋 Inspetores</button>
      <button onclick="mudarAba('adm')" id="btn-aba-adm" class="aba-btn py-3 px-4 border-b-2 text-gray-600 flex items-center gap-2 bg-emerald-50 text-[#1b4332]">⚙️ ADM (Acessos)</button>
    </nav>

    <main class="p-6 max-w-6xl w-full mx-auto flex-1">

      <section id="aba-atrasos" class="aba-conteudo" style="display: block;">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
          <div class="flex gap-4 border-b border-gray-200 pb-3 mb-4">
            <button onclick="setAtrasoTurno('Matutino')" id="btn-turno-mat" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-8
