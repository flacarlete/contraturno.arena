<div style="font-family: Arial; padding: 20px;">
  <div style="margin-bottom: 15px;">
    <button onclick="mudar('um')" id="b-um" style="padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; font-weight: bold;">Aba 1</button>
    <button onclick="mudar('dois')" id="b-dois" style="padding: 10px 20px; background: #ccc; border: none; cursor: pointer;">Aba 2</button>
  </div>

  <div id="p-um" style="display: block; padding: 15px; border: 1px solid #ccc;">
    Conteúdo da Aba 1 a funcionar perfeitamente!
  </div>

  <div id="p-dois" style="display: none; padding: 15px; border: 1px solid #ccc;">
    Conteúdo da Aba 2 a funcionar perfeitamente!
  </div>
</div>

<script>
  function mudar(id) {
    document.getElementById('p-um').style.display = (id === 'um') ? 'block' : 'none';
    document.getElementById('p-dois').style.display = (id === 'dois') ? 'block' : 'none';
    
    document.getElementById('b-um').style.background = (id === 'um') ? 'green' : '#ccc';
    document.getElementById('b-dois').style.background = (id === 'dois') ? 'green' : '#ccc';
  }
</script>
